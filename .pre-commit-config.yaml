# Static checks, run on every commit (after `uv run pre-commit install`) and
# in CI via `uv run pre-commit run --all-files`.
#
# Every hook runs the tool from the project's locked environment via `uv run`,
# so tool versions come from uv.lock alone and are never duplicated here.
repos:
  # -------------------------------------------------------------------------
  # File hygiene (console scripts from the `pre-commit-hooks` PyPI package)
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: check-added-large-files
        name: check for added large files
        entry: uv run --locked check-added-large-files
        language: system

      - id: check-case-conflict
        name: check for case conflicts
        entry: uv run --locked check-case-conflict
        language: system

      - id: check-merge-conflict
        name: check for merge conflict markers
        entry: uv run --locked check-merge-conflict
        language: system
        types: [text]

      - id: detect-private-key
        name: detect private keys
        entry: uv run --locked detect-private-key
        language: system
        types: [text]

      - id: check-toml
        name: check toml
        entry: uv run --locked check-toml
        language: system
        types: [toml]

      - id: check-yaml
        name: check yaml
        entry: uv run --locked check-yaml
        language: system
        types: [yaml]

      - id: check-shebang-scripts-are-executable
        name: check that scripts with shebangs are executable
        entry: uv run --locked check-shebang-scripts-are-executable
        language: system
        types: [text]

      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run --locked end-of-file-fixer
        language: system
        types: [text]

      - id: mixed-line-ending
        name: fix mixed line endings
        entry: uv run --locked mixed-line-ending --fix=lf
        language: system
        types: [text]

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run --locked trailing-whitespace-fixer --markdown-linebreak-ext=md
        language: system
        types: [text]

  # -------------------------------------------------------------------------
  # Python toolchain
  # -------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ty
        name: ty check
        entry: uv run --locked ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
